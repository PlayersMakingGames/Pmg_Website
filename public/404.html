<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PlayersMakingGames</title>
    <!-- GitHub Pages 404s any direct/refreshed link to a client-side route
         (e.g. /Pmg_Website/about). This encodes the intended path into a
         query string and redirects to index.html, where a matching snippet
         decodes it before React Router mounts, so the SPA still loads the
         right page. https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
